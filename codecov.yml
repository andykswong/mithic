comment:
  layout: "header, diff, flags, components"
component_management:
  individual_components:
    - component_id: "@mithic/coreutils"
      paths:
        - "packages/coreutils"
    - component_id: "@mithic/io"
      paths:
        - "packages/io"
    - component_id: "@mithic/process"
      paths:
        - "packages/process"
    - component_id: "@mithic/shell"
      paths:
        - "packages/shell"
    - component_id: "@mithic/wasip2"
      paths:
        - "packages/wasip2"
    - component_id: "@mithic/worker"
      paths:
        - "packages/worker"
coverage:
  status:
    project:
      default:
        target: 80%
        threshold: 2%
    patch:
      default:
        target: 90%
        threshold: 5%
ignore:
  - "packages/examples/*"
