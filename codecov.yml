comment:
  layout: "header, diff, flags, components"
component_management:
  individual_components:
    - component_id: "@mithic/commons"
      paths:
        - "packages/commons"
    - component_id: "@mithic/core"
      paths:
        - "packages/core"
    - component_id: "@mithic/keyvalue"
      paths:
        - "packages/keyvalue"
    - component_id: "@mithic/messaging"
      paths:
        - "packages/messaging"
    - component_id: "@mithic/denokv"
      paths:
        - "packages/plugins/denokv"
    - component_id: "@mithic/level"
      paths:
        - "packages/plugins/level"
    - component_id: "@mithic/redis"
      paths:
        - "packages/plugins/redis"
coverage:
  status:
    project:
      default:
        target: 90%
        threshold: 2%
    patch:
      default:
        target: 90%
        threshold: 2%
ignore:
  - "packages/examples/*"
