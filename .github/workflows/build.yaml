name: build
on:
  push:
    branches: [main, wasm]
  pull_request:
    branches: [main, wasm]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
    - run: rustup target add wasm32-wasip2
    - run: npm ci
    - run: npm run typecheck
    - run: npm run build
    - run: npm test
    - uses: codecov/codecov-action@v6
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
