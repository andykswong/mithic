[package]
name = "mithic_shell"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
wit-bindgen = { version = "0.58" }
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }
getrandom = { version = "0.4", default-features = false, features = [] }

[package.metadata.component]
package = "mithic:shell"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
