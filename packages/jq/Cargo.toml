[package]
name = "mithic_jq"
edition = "2024"
publish = false

[dependencies]
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }

[package.metadata.component]
package = "mithic:jq"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
