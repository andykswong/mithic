 href="../assets/icons.svg#icon-menu"></use></svg></a></div></header><div class="container container-main"><div class="col-content"><div class="tsd-page-title"><ul class="tsd-breadcrumb" aria-label="Breadcrumb"><li><a href="../modules/_mithic_runtime.html">@mithic/runtime</a></li><li><a href="../modules/_mithic_runtime.backends_iframe.html">backends/iframe</a></li><li><a href="" aria-current="page">IframeRuntime</a></li></ul><h1>Class IframeRuntime</h1></div><section class="tsd-panel tsd-comment"><div class="tsd-comment tsd-typography"><p>IframeRuntime spawns guest code inside a sandboxed <iframe> element.</p>
<p>The iframe is created with <code>sandbox=&quot;allow-scripts&quot;</code> — no <code>allow-same-origin</code> —
so the guest runs in an opaque origin and cannot access parent DOM or storage.</p>
<p>Communication protocol (matches WorkerRuntime exactly):</p>
<ol>
<li>spawn() posts { __mithic_init, ports } with transferList to the iframe's contentWindow</li>
<li>spawn() posts { __mithic_run: codeStr } to trigger evaluation</li>
<li>Inbound messages from the iframe are routed to onMessage() callbacks</li>
<li>postMessage() sends a message down to the iframe</li>
<li>kill() / dispose() removes the iframe from the DOM</li>
</ol>
<p>Display modes:</p>
<ul>
<li>'hidden' (default): iframe is appended to document.body with display:none</li>
<li>'inline': iframe is appended to document.body, sized per options.display</li>
<li>'window' / 'fullscreen': treated same as inline for now</li>
</ul>
</div></section><section class="tsd-panel"><h4>Implements</h4><ul class="tsd-hierarchy"><li><a href="../interfaces/_mithic_runtime..Runtime.html" class="tsd-signature-type tsd-kind-interface">Runtime</a></li></ul></section><aside class="tsd-sources"><ul><li>Defined in <a href="https://github.com/andykswong/mithic/blob/65a7ea33048a1d1694216359585f654ba832887e/packages/runtime/src/backends/iframe.ts#L35">backends/iframe.ts:35</a></li></ul></aside><section class="tsd-panel-group tsd-index-group"><section class="tsd-panel tsd-index-panel"><details class="tsd-index-content tsd-accordion" open><summary class="tsd-accordion-summary tsd-index-summary"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><use href="../assets/icons.svg#icon-chevronDown"></use></svg><h5 class="tsd-index-heading uppercase">Index</h5></summary><div class="tsd-accordion-details"><section class="tsd-index-section"><h3 class="tsd-index-heading">Constructors</h3><div class="tsd-index-list"><a href="#constructor" class="tsd-index-link"><svg class="tsd-kind-icon" viewBox="0 0 24 24" aria-label="Constructor"><use href="../assets/icons.svg#icon-512"></use></svg><span>constructor</span></a>
